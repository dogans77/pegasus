version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: pegasus-postgres

    restart: always

    environment:
      POSTGRES_USER: pegasus
      POSTGRES_PASSWORD: pegasus
      POSTGRES_DB: pegasus

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: pegasus-redis

    restart: always

    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4

    container_name: pegasus-pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pegasus.ai
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

volumes:

  postgres-data: